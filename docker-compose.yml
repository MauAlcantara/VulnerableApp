version: "3.9"

services:
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - observability_net

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    networks:
      - observability_net

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      # Bind Mount: Conecta la carpeta local de Logs al contenedor de Promtail
      - ./Logs:/var/log/VulnerableApp 
      # Monta el archivo de configuración que crearemos en el siguiente paso
      - ./promtail-config.yaml:/etc/promtail/config.yml 
    command: -config.file=/etc/promtail/config.yml
    networks:
      - observability_net

networks:
  observability_net:

volumes:
  grafana_data:
  loki_data: